<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Lab">
  <!-- Three stages on a routed rail. Drawn for a 22px chip: no ground, three
       shapes, a thin rail against fat nodes so the gaps survive the downscale.
       A fan-out reads as the share icon and a straight rail as an ellipsis, so
       the elbow is what makes this one its own thing. -->
  <path d="M128 168 L384 168 L384 384" fill="none" stroke="#76e4f4" stroke-width="26"
    stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="128" cy="168" r="72" fill="#76e4f4"/>
  <circle cx="384" cy="168" r="60" fill="#76e4f4"/>
  <circle cx="384" cy="384" r="72" fill="#76e4f4"/>
</svg>
