name: Deploy to IPFS (Pinata)

# Builds the static export and pins it to Pinata as a browsable IPFS folder
# on every push to this branch.
#
# One-time setup (yours — needs your Pinata account + repo access):
#   1. Pinata dashboard -> API Keys -> create a key with pinFileToIPFS scope, copy the JWT.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret named  PINATA_JWT_TOKEN  = that JWT.
#
# After each run, the CID is printed in the run Summary. Point monodev.eth's
# ENS "Content Hash" record at  ipfs://<cid>  (one-off, on-chain tx).
#
# Note: folder pinning uses Pinata's free-tier pinFromFS path — CAR uploads
# are paid-only, so we upload the directory directly.

on:
  push:
    branches: [ipfs-export]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build # next build && cp out/index out/index.html -> ./out

      - name: Install Pinata SDK
        run: npm install --no-save @pinata/sdk

      - name: Pin ./out to Pinata
        env:
          PINATA_JWT_TOKEN: ${{ secrets.PINATA_JWT_TOKEN }}
        run: node scripts/pin-to-pinata.cjs
